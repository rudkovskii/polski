<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
    <clipPath id="card"><rect x="150" y="120" width="212" height="272" rx="30"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="#2f6fed"/>
    <g transform="rotate(-8 256 256)">
      <g clip-path="url(#card)">
        <rect x="150" y="120" width="212" height="272" fill="#ffffff"/>
        <rect x="150" y="284" width="212" height="108" fill="#d23b3b"/>
      </g>
      <rect x="150" y="120" width="212" height="272" rx="30" fill="none" stroke="#173e93" stroke-width="12"/>
    </g>
  </g>
</svg>
